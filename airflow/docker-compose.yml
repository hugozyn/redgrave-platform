# AFC Redgrave · Airflow on your laptop (one container, "standalone" mode: web UI + scheduler).
# Start:  docker compose up        UI: http://localhost:8081  (no login: on this laptop setup every user is admin)
# Stop:   Ctrl+C then  docker compose down
services:
  airflow:
    build: .
    image: redgrave-airflow:1.0.0
    command: standalone
    ports:
      - "127.0.0.1:8081:8080"
    env_file: .env                                  # your account, user and keys folder (not committed)
    environment:
      PYTHONUSERBASE: /home/airflow/.local
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "Europe/London"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    volumes:
      - ./dags:/opt/airflow/dags
      # Lets Airflow start the redgrave-ingest and redgrave-dbt containers on your Docker.
      - /var/run/docker.sock:/var/run/docker.sock
    # Teaching shortcut: root is needed to use the Docker socket on a laptop.
    # In production the tasks run on Kubernetes (KubernetesPodOperator) and nothing runs as root.
    user: "0:0"
